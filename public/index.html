<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>J.A.R.V.I.S.</title>
<style>
  :root {
    --bg: #050a10;
    --panel: #0a1420;
    --accent: #4fd6ff;
    --accent-dim: #1c5a70;
    --accent-glow: rgba(79, 214, 255, 0.35);
    --text: #d8f4ff;
    --text-dim: #6f95a8;
    --danger: #ff5f5f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at center, #0c1c28 0%, var(--bg) 70%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #app {
    display: flex; flex-direction: column;
    height: 100%;
    max-width: 520px; margin: 0 auto;
    padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px);
  }
  header {
    text-align: center; padding: 10px 0 18px;
    letter-spacing: 6px; font-weight: 300; font-size: 15px;
    color: var(--accent);
    text-shadow: 0 0 12px var(--accent-glow);
  }
  header .sub { display: block; font-size: 10px; letter-spacing: 3px; color: var(--text-dim); margin-top: 4px; }

  #core-wrap { display: flex; justify-content: center; align-items: center; padding: 18px 0; }
  #core {
    width: 130px; height: 130px; border-radius: 50%;
    position: relative;
    background: radial-gradient(circle at center, #0e2a38 0%, #061019 70%);
    border: 2px solid var(--accent-dim);
    box-shadow: 0 0 30px var(--accent-glow), inset 0 0 30px rgba(79,214,255,0.15);
    display: flex; align-items: center; justify-content: center;
    transition: box-shadow 0.3s ease;
  }
  #core::before, #core::after {
    content: ''; position: absolute; border-radius: 50%;
    border: 1px solid var(--accent-dim); opacity: 0.6;
  }
  #core::before { width: 100px; height: 100px; }
  #core::after { width: 68px; height: 68px; }
  #core-dot {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 20px 6px var(--accent-glow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #core.listening { box-shadow: 0 0 55px var(--accent-glow), inset 0 0 45px rgba(79,214,255,0.3); }
  #core.listening #core-dot { animation: pulse 1.1s ease-in-out infinite; }
  #core.speaking #core-dot { animation: speak 0.4s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.35); }
  }
  @keyframes speak {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  #status { text-align: center; font-size: 12px; color: var(--text-dim); letter-spacing: 2px; height: 18px; text-transform: uppercase; }

  #log {
    flex: 1; overflow-y: auto; margin: 14px 0;
    display: flex; flex-direction: column; gap: 10px;
    padding-right: 2px;
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 14.5px; line-height: 1.4; }
  .msg.user { align-self: flex-end; background: #163244; color: var(--text); border-bottom-right-radius: 4px; }
  .msg.jarvis { align-self: flex-start; background: rgba(79,214,255,0.08); border: 1px solid var(--accent-dim); border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; color: var(--text-dim); font-size: 12px; font-style: italic; }

  #controls { display: flex; gap: 10px; align-items: center; padding-bottom: 6px; }
  #textInput {
    flex: 1; background: var(--panel); border: 1px solid var(--accent-dim);
    color: var(--text); padding: 12px 14px; border-radius: 22px; font-size: 14px; outline: none;
  }
  #textInput:focus { border-color: var(--accent); }
  button {
    border: none; cursor: pointer; font-family: inherit;
  }
  #micBtn {
    width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
    background: var(--panel); border: 1px solid var(--accent-dim);
    color: var(--accent); font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  #micBtn.active { background: var(--accent); color: #04141c; box-shadow: 0 0 20px var(--accent-glow); }
  #wakeBtn {
    background: var(--panel); border: 1px solid var(--accent-dim); color: var(--text-dim);
    font-size: 11px; padding: 8px 10px; border-radius: 16px; white-space: nowrap;
  }
  #wakeBtn.active { background: var(--accent-dim); color: var(--text); border-color: var(--accent); }
  #sendBtn {
    width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent-dim); color: var(--text); font-size: 18px;
  }
  #settingsBtn {
    position: absolute; top: 14px; right: 14px;
    background: none; color: var(--text-dim); font-size: 18px; width: 32px; height: 32px;
  }
  #banner {
    background: rgba(255,95,95,0.1); border: 1px solid var(--danger); color: #ffb3b3;
    font-size: 12.5px; padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; display: none;
  }
</style>
</head>
<body>
<div id="app">
  <button id="settingsBtn" title="About / help" onclick="alert('JARVIS is running locally.\n\nBackend: this server (server.js)\nModel: Claude via the Anthropic API\n\nTap the mic and speak, or type below. See README.md for setup and Home Assistant integration.')">i</button>
  <header>J . A . R . V . I . S .<span class="sub">PERSONAL ASSISTANT ONLINE</span></header>
  <div id="banner"></div>
  <div id="core-wrap"><div id="core"><div id="core-dot"></div></div></div>
  <div id="status">Standing by</div>
  <div id="log"></div>
  <div id="controls">
    <button id="wakeBtn" title="Toggle wake word listening">Wake word: OFF</button>
    <button id="micBtn" title="Hold to talk">🎤</button>
    <input id="textInput" type="text" placeholder="Or type to JARVIS…" />
    <button id="sendBtn" title="Send">➤</button>
  </div>
</div>

<script>
const log = document.getElementById('log');
const statusEl = document.getElementById('status');
const core = document.getElementById('core');
const micBtn = document.getElementById('micBtn');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const banner = document.getElementById('banner');

let history = []; // full Claude message history (kept on client, sent each request)
let busy = false;

function extractDisplayText(msgContent) {
  if (typeof msgContent === 'string') return msgContent;
  if (Array.isArray(msgContent)) {
    return msgContent.filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
  }
  return '';
}

function saveHistory() {
  try { localStorage.setItem('jarvis-history', JSON.stringify(history)); } catch (e) {}
}

function loadHistory() {
  try {
    const raw = localStorage.getItem('jarvis-history');
    if (raw) history = JSON.parse(raw);
  } catch (e) { history = []; }
}

function renderHistory() {
  log.innerHTML = '';
  if (!history.length) {
    loadHistory();
renderHistory();
    return;
  }
  for (const msg of history) {
    const text = extractDisplayText(msg.content);
    if (!text) continue;
    addMsg(text, msg.role === 'user' ? 'user' : 'jarvis');
  }
}

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function showBanner(msg) {
  banner.textContent = msg;
  banner.style.display = 'block';
}

function setStatus(text) { statusEl.textContent = text; }

async function sendToJarvis(userText) {
  if (!userText.trim() || busy) return;
  busy = true;
  addMsg(userText, 'user');
  history.push({ role: 'user', content: userText });
  setStatus('Thinking…');
  core.classList.remove('listening');

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Server error');

    history = data.messages;
    addMsg(data.reply, 'jarvis');
    saveHistory();
    speak(data.reply);
  } catch (err) {
    addMsg('Error: ' + err.message, 'system');
    showBanner('Something went wrong talking to the server. Check that server.js is running and your API key is set.');
    setStatus('Standing by');
  } finally {
    busy = false;
  }
}

// ---- Text-to-speech ----
async function speak(text) {
  core.classList.add('speaking');
  setStatus('Speaking');
  try {
    const resp = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!resp.ok) throw new Error('TTS request failed');
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.onended = () => { core.classList.remove('speaking'); setStatus('Standing by'); URL.revokeObjectURL(url); };
    audio.onerror = () => { core.classList.remove('speaking'); setStatus('Standing by'); };
    await audio.play();
  } catch (err) {
    console.error('TTS error', err);
    core.classList.remove('speaking');
    setStatus('Standing by');
  }
}
let cachedVoices = [];
function loadVoices() { cachedVoices = window.speechSynthesis.getVoices(); }
loadVoices();
window.speechSynthesis?.addEventListener?.('voiceschanged', loadVoices);

// ---- Speech-to-text (Web Speech API) ----
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    sendToJarvis(transcript);
  };
  recognition.onerror = (e) => {
    if (e.error !== 'no-speech') showBanner('Mic error: ' + e.error);
    stopListening();
  };
  recognition.onend = () => stopListening();
} else {
  showBanner('Voice recognition isn\'t supported in this browser. Try Chrome on desktop/Android, or use the text box below. (Safari/iOS support for the Web Speech API is limited.)');
  micBtn.style.opacity = '0.4';
}

function startListening() {
  if (!recognition || listening) return;
  listening = true;
  micBtn.classList.add('active');
  core.classList.add('listening');
  setStatus('Listening…');
  try { recognition.start(); } catch (e) {}
}
function stopListening() {
  listening = false;
  micBtn.classList.remove('active');
  core.classList.remove('listening');
  if (statusEl.textContent === 'Listening…') setStatus('Standing by');
  if (wakeWordEnabled) setTimeout(startWakeListening, 500);
}

let wakeWordEnabled = false;
let wakeRecognition = null;
const WAKE_PHRASES = ['yo jarvis', 'wake up jarvis', 'jarvis darling'];

function startWakeListening() {
  if (!SpeechRecognition) return;
  wakeRecognition = new SpeechRecognition();
  wakeRecognition.continuous = true;
  wakeRecognition.interimResults = false;
  wakeRecognition.lang = 'en-US';
  wakeRecognition.onresult = (e) => {
    const said = e.results[e.results.length - 1][0].transcript.toLowerCase();
    if (WAKE_PHRASES.some(phrase => said.includes(phrase))) {
      wakeRecognition.stop();
      setStatus('Wake word heard!');
      startListening();
    }
  };
  wakeRecognition.onerror = () => {};
  wakeRecognition.onend = () => {
    if (wakeWordEnabled && !listening) {
      try { wakeRecognition.start(); } catch (e) {}
    }
  };
  try { wakeRecognition.start(); } catch (e) {}
}

function stopWakeListening() {
  if (wakeRecognition) { wakeRecognition.stop(); wakeRecognition = null; }
}

wakeBtn.addEventListener('click', () => {
  wakeWordEnabled = !wakeWordEnabled;
  wakeBtn.classList.toggle('active', wakeWordEnabled);
  wakeBtn.textContent = wakeWordEnabled ? 'Wake word: ON' : 'Wake word: OFF';
  if (wakeWordEnabled) {
    startWakeListening();
    setStatus('Listening for wake word...');
  } else {
    stopWakeListening();
    setStatus('Standing by');
  }
});

micBtn.addEventListener('click', () => {
  if (listening) { recognition.stop(); } else { startListening(); }
});

sendBtn.addEventListener('click', () => {
  const val = textInput.value;
  textInput.value = '';
  sendToJarvis(val);
});
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { sendBtn.click(); }
});

loadHistory();
renderHistory();
</script>
</body>
</html>
